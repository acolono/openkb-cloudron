; All logs go to the app log (stdout/stderr); Cloudron rotates nothing here.

[program:opensearch]
command=/app/pkg/run-opensearch.sh
user=cloudron
environment=HOME="/tmp/opensearch"
priority=10
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:apache]
command=/app/pkg/run-apache.sh
priority=20
autostart=true
autorestart=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=/usr/local/node/bin/node .output/server/index.mjs
directory=/app/frontend
user=cloudron
environment=HOME="/tmp"
priority=30
autostart=true
autorestart=true
; The shutdown flushes the collab store to SQLite (upstream stop_grace_period).
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:boot]
command=/app/pkg/boot.sh
user=www-data
environment=HOME="/run/openkb/home"
priority=40
autostart=true
autorestart=false
startsecs=0
startretries=0
exitcodes=0,1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
