# Drupal on the ADMIN_DOMAIN port. Replaces upstream's Caddyfile; Drupal's own
# web/.htaccess covers the file protections the Caddyfile spelled out.
<VirtualHost *:8080>
    DocumentRoot /app/web

    <Directory /app/web>
        Options +FollowSymLinks -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # The setup page while /run/openkb/.openkb-holding exists (first install,
    # update window). Same contract as the Caddyfile: every path answers 503
    # with Retry-After and X-OpenKB-Hold, which the frontend reads to hold its
    # own page.
    Alias /__openkb_holding.html /usr/local/share/openkb/holding.html
    <Directory /usr/local/share/openkb>
        Require all granted
    </Directory>

    <If "-f '/run/openkb/.openkb-holding'">
        ErrorDocument 503 /__openkb_holding.html
        Header always set Retry-After "10"
        Header always set X-OpenKB-Hold "install"
    </If>

    RewriteEngine On
    RewriteCond /run/openkb/.openkb-holding -f
    RewriteCond %{REQUEST_URI} !^/__openkb_holding\.html$
    RewriteRule ^ - [R=503,L]
</VirtualHost>
