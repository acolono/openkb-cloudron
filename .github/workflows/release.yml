# Tag vX.Y.Z (matching "version" in CloudronManifest.json) to release:
# builds and pushes ghcr.io/<owner>/<repo>:X.Y.Z, adds the version to
# CloudronVersions.json on main, and creates a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      state:
        description: "publishState of the new version"
        type: choice
        options: [published, testing]
        default: published

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          version=$(python3 -c 'import json;print(json.load(open("CloudronManifest.json"))["version"])')
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match manifest version ${version}"; exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} as ${image}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.v.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update CloudronVersions.json on main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          # The manifest of the tagged commit is the one being published.
          git checkout "${GITHUB_SHA}" -- CloudronManifest.json CHANGELOG DESCRIPTION.md POSTINSTALL.md
          python3 scripts/update-versions.py "${{ steps.v.outputs.image }}" --state "${{ inputs.state || 'published' }}"
          git reset -q HEAD -- CloudronManifest.json CHANGELOG DESCRIPTION.md POSTINSTALL.md
          git checkout -- CloudronManifest.json CHANGELOG DESCRIPTION.md POSTINSTALL.md
          timeout 180 npx --yes cloudron@latest versions verify \
            || echo "::warning::cloudron versions verify failed or is unavailable; check the catalog by hand"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CloudronVersions.json
          git commit -m "Publish ${{ steps.v.outputs.version }}" || echo "catalog unchanged"
          git push origin main

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(python3 - <<'PY'
          import json, re
          v = json.load(open("CloudronManifest.json"))["version"]
          m = re.search(rf"^\[{re.escape(v)}\]\s*\n(.*?)(?=^\[|\Z)", open("CHANGELOG").read(), re.M | re.S)
          print(m.group(1).strip() if m else "")
          PY
          )
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
            --notes "${notes}

          Image: \`${{ steps.v.outputs.image }}\`"
